<!doctype html>
<!-- Signing guide (spec 036): several signers and PAdES, step by step, with
     screenshots of the app. Texts come from src/i18n (guide.* keys): the
     build writes the English ones into this file, and src/guide/main.ts
     switches them, and the screenshots, to the visitor's language. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="guide.title"></title>
    <meta name="description" data-i18n-attr="content:guide.description" />
    <link rel="canonical" href="https://inkognitopdf.com/guia/firmar/" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="InkognitoPDF" />
    <meta property="og:title" data-i18n-attr="content:guide.heading" />
    <meta
      property="og:description"
      data-i18n-attr="content:guide.description"
    />
    <meta property="og:url" content="https://inkognitopdf.com/guia/firmar/" />
    <meta
      property="og:image"
      content="https://inkognitopdf.com/brand/og-image.png"
    />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#23272F" />
    <script>
      // Runs before the first paint: when the visitor's language is not the
      // one written in the page, the page stays hidden until main.ts has
      // switched it (landing.css shows it anyway after 1.5 s). Same rule as
      // detectLang() in src/i18n/core.ts.
      (function () {
        var lang = null;
        try {
          lang = localStorage.getItem("inkognitopdf.lang");
        } catch (e) {}
        if (lang !== "es" && lang !== "en") {
          lang = "en";
          var list = navigator.languages || [];
          for (var i = 0; i < list.length; i++) {
            var primary = list[i].toLowerCase().split("-")[0];
            if (primary === "es" || primary === "en") {
              lang = primary;
              break;
            }
          }
        }
        if (lang !== document.documentElement.lang) {
          document.documentElement.classList.add("i18n-pending");
          document.documentElement.lang = lang;
        }
      })();
    </script>
  </head>
  <body class="guide">
    <a class="skip" href="#main" data-i18n="landing.skip"></a>

    <header class="site-header">
      <div class="wrap header-row">
        <a class="logo" href="/" data-i18n-attr="aria-label:landing.home">
          <img
            src="/brand/logo-dark.svg"
            alt="InkognitoPDF"
            width="145"
            height="32"
          />
        </a>
        <div
          class="lang-switch"
          role="group"
          data-i18n-attr="aria-label:lang.label"
        >
          <button
            type="button"
            lang="es"
            data-lang="es"
            aria-pressed="false"
            data-i18n-attr="aria-label:lang.es"
          >
            ES
          </button>
          <button
            type="button"
            lang="en"
            data-lang="en"
            aria-pressed="false"
            data-i18n-attr="aria-label:lang.en"
          >
            EN
          </button>
        </div>
        <a
          class="button button-small"
          href="/app/"
          data-i18n="landing.openApp"
        ></a>
      </div>
    </header>

    <main id="main">
      <section class="guide-intro">
        <div class="wrap narrow">
          <p class="eyebrow" data-i18n="guide.eyebrow"></p>
          <h1 data-i18n="guide.heading"></h1>
          <p class="lead" data-i18n="guide.lead"></p>
          <nav class="guide-toc" aria-labelledby="toc-title">
            <h2 id="toc-title" data-i18n="guide.toc"></h2>
            <ol>
              <li><a href="#firma-digital" data-i18n="guide.toc1"></a></li>
              <li><a href="#varios-firmantes" data-i18n="guide.toc2"></a></li>
              <li><a href="#comprobar" data-i18n="guide.toc3"></a></li>
              <li><a href="#preguntas" data-i18n="guide.toc4"></a></li>
            </ol>
          </nav>
        </div>
      </section>

      <section

          <p class="section-lead" data-i18n="guide.padesWhat"></p>
          <ol class="guide-steps">
            <li data-i18n="guide.padesStep1"></li>
            <li data-i18n="guide.padesStep2"></li>
          </ol>
          <figure class="shot">
            <img
              data-shot="pades-place"
              src="/guia/firmar/img/en/pades-place.webp"
              width="1280"
              height="800"
              loading="lazy"
              decoding="async"
              alt=""
            />
            <figcaption data-i18n="guide.padesShotPlace"></figcaption>
          </figure>
          <ol class="guide-steps" start="3">
            <li data-i18n="guide.padesStep3"></li>
            <li>
              <span data-i18n="guide.padesStep4"></span>
              <ul>
                <li data-i18n="guide.padesCertP12"></li>
                <li data-i18n="guide.padesCertOwn"></li>
              </ul>
              <p class="guide-note" data-i18n="guide.padesCertKept"></p>
            </li>
            <li data-i18n="guide.padesStep5"></li>
            <li data-i18n="guide.padesStep6"></li>
          </ol>
          <figure class="shot">
            <img
              data-shot="pades-save"
              src="/guia/firmar/img/en/pades-save.webp"
              width="1280"
              height="800"
              loading="lazy"
              decoding="async"

            />
            <figcaption data-i18n="guide.padesShotSave"></figcaption>
          </figure>
          <p
            class="guide-warning"
            role="note"
            data-i18n="guide.padesWarning"
          ></p>
        </div>
      </section>

      <section

      >
        <div class="wrap narrow">

          <ol class="guide-steps" start="2">

      <section
