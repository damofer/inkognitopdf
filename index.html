     build writes the English ones into this file, and src/landing/main.ts
     switches them to the visitor's language. -->

    <script>
      // Runs before the first paint. An installed app made when it lived at
      // "/" opens straight in the app; and when the visitor's language is
      // not the one written in the page, the page stays hidden until
      // main.ts has switched it (landing.css shows it anyway after 1.5 s).
      // Same rule as detectLang() in src/i18n/core.ts.
      (function () {
        if (matchMedia("(display-mode: standalone)").matches) {
          location.replace("/app/");
          return;
        }
        var lang = null;
        try {
          lang = localStorage.getItem("inkognitopdf.lang");
        } catch (e) {}
        if (lang !== "es" && lang !== "en") {
          lang = "en";
          var list = navigator.languages || [];
          for (var i = 0; i < list.length; i++) {
            var primary = list[i].toLowerCase().split("-")[0];
            if (primary === "es" || primary === "en") {
              lang = primary;
              break;
            }
          }
        }
        if (lang !== document.documentElement.lang) {
          document.documentElement.classList.add("i18n-pending");
          document.documentElement.lang = lang;
        }
        // The promo video's poster, in that language, is the hero's largest
        // image: fetched with the page instead of after the scripts (promo.ts
        // shows it; same files as its PROMO_FILES).
        var poster = document.createElement("link");
        poster.rel = "preload";
        poster.setAttribute("as", "image");
        poster.type = "image/webp";
        poster.href =
          lang === "es"
            ? "/promo/promo-poster-720-es.webp"
            : "/promo/promo-poster-720.webp";
        poster.setAttribute("fetchpriority", "high");
        document.head.appendChild(poster);
      })();
    </script>

            <li>
              <span class="step-num" aria-hidden="true">1</span>
              <h3 data-i18n="landing.step1Title"></h3>
              <p data-i18n="landing.step1Text"></p>
            </li>
            <li>
              <span class="step-num" aria-hidden="true">2</span>
              <h3 data-i18n="landing.step2Title"></h3>
              <p data-i18n="landing.step2Text"></p>
            </li>
            <li>
              <span class="step-num" aria-hidden="true">3</span>

              <p data-i18n="landing.step3Text"></p>

      <section
        id="open-source"
        class="section open-source"
        aria-labelledby="os-title"
      >
        <div class="wrap os-box">
          <img src="/brand/mark-dark.svg" alt="" width="64" height="64" />

            <h2 id="os-title" data-i18n="landing.osTitle"></h2>
            <p data-i18n="landing.osText"></p>

              <a

                data-i18n="landing.osLicense"
              ></a>
            </p>
            <p>
              <a

                rel="noopener noreferrer"
                data-i18n="landing.osCode"
              ></a>
            </p>
          </div>
        </div>
      </section>

      <section
        id="support"
        class="section support"
        aria-labelledby="support-title"
      >
        <div class="wrap narrow support-box">
          <h2 id="support-title" class="center" data-i18n="support.title"></h2>
          <p class="center" data-i18n="support.lead"></p>
          <!-- Plain links, no payment script. main.ts puts them in the order
               of the visitor's language and names the second group. -->
          <div class="support-options" data-support-options>
            <div
              class="support-group"
              data-provider="mercadoPago"
              data-heading-first="support.mpTitle"
              data-heading-later="support.fromColombia"
            >
              <h3 data-support-heading></h3>
              <p class="support-note" data-i18n="support.mpNote"></p>
              <div class="support-amounts">
                <a
                  class="support-link"
                  href="https://mpago.li/1Kyib9Q"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-tier="10000"
                  >$10.000 COP</a
                >
                <a
                  class="support-link"
                  href="https://mpago.li/1sVMAt1"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-tier="20000"
                  >$20.000 COP</a
                >
                <a
                  class="support-link"
                  href="https://mpago.li/2s9ot7Z"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-tier="50000"
                  >$50.000 COP</a
                >
                <a
                  class="support-link"
                  href="https://link.mercadopago.com.co/damofer"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-tier="other"
                  data-i18n="support.other"
                ></a>
              </div>
            </div>
            <div
              class="support-group"
              data-provider="kofi"
              data-heading-later="support.abroad"
            >
              <h3 data-support-heading></h3>
              <a
                class="support-link support-kofi"
                href="https://ko-fi.com/damofer"
                target="_blank"
                rel="noopener noreferrer"
                data-tier="kofi"
                data-i18n="support.kofi"
              ></a>
              <p class="support-note" data-i18n="support.kofiNote"></p>
            </div>
          </div>
          <p class="center support-note" data-i18n="support.thanks"></p>
        </div>
      </section>

        <div class="wrap narrow">

            <p data-i18n="landing.faq5A"></p>

        aria-labelledby="analytics-title"

        <div class="wrap narrow">
          <h2 id="analytics-title" data-i18n="privacy.title"></h2>
          <p class="section-lead" data-i18n="privacy.intro"></p>
          <div class="analytics-grid">
            <div>
              <h3 data-i18n="privacy.measuredTitle"></h3>
              <p data-i18n="privacy.measured"></p>
            </div>
            <div>
              <h3 data-i18n="privacy.notMeasuredTitle"></h3>
              <p data-i18n="privacy.notMeasured"></p>
            </div>
          </div>
          <p data-i18n="privacy.optional"></p>
          <p
            class="analytics-state"
            data-analytics-state
            aria-live="polite"
          ></p>
          <div class="analytics-actions">
            <button
              type="button"
              class="button button-ghost"
              data-consent="denied"
              data-i18n="privacy.deny"
            ></button>
            <button
              type="button"
              class="button button-ghost"
              data-consent="granted"
              data-i18n="privacy.allow"
            ></button>
          </div>
        </div>

      <section class="cta" aria-labelledby="cta-title">
        <div class="wrap center">
          <h2 id="cta-title" data-i18n="landing.ctaTitle"></h2>
          <p data-i18n="landing.ctaText"></p>

          <a href="#analytics" data-i18n="privacy.title"></a>

        <a href="#analytics" data-i18n="privacy.more"></a>

        <button

          class="button button-ghost button-small"
          data-consent="denied"
          data-i18n="privacy.reject"

        <button

          class="button button-ghost button-small"
          data-consent="granted"
          data-i18n="privacy.accept"
