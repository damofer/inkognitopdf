<!doctype html>
<!-- Landing page (spec 008). Texts come from src/i18n (landing.* keys): the
     build writes the English ones into this file, and src/landing/main.ts
     switches them to the visitor's language. -->

    />
    <link rel="canonical" href="https://inkognitopdf.com/" />
    <!-- Link previews (WhatsApp, Telegram, X, Facebook, LinkedIn): read from
         this static HTML, since crawlers do not run scripts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InkognitoPDF" />

      property="og:title"

    <script>
      // Runs before the first paint. An installed app made when it lived at
      // "/" opens straight in the app; and when the visitor's language is
      // not the one written in the page, the page stays hidden until
      // main.ts has switched it (landing.css shows it anyway after 1.5 s).
      // Same rule as detectLang() in src/i18n/core.ts.
      (function () {
        if (matchMedia("(display-mode: standalone)").matches) {
          location.replace("/app/");
          return;
        }
        var lang = null;
        try {
          lang = localStorage.getItem("inkognitopdf.lang");
        } catch (e) {}
        if (lang !== "es" && lang !== "en") {
          lang = "en";
          var list = navigator.languages || [];
          for (var i = 0; i < list.length; i++) {
            var primary = list[i].toLowerCase().split("-")[0];
            if (primary === "es" || primary === "en") {
              lang = primary;
              break;
            }
          }
        }
        if (lang !== document.documentElement.lang) {
          document.documentElement.classList.add("i18n-pending");
          document.documentElement.lang = lang;
        }
      })();
    </script>
