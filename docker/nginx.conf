# Same routes, cache headers and Content-Security-Policy as firebase.json,
# and the timestamp relay of functions/ (spec 040).
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
    }

    # Spec 039: the browser refuses connections to other sites (see src/csp.ts).
    # add_header in a location drops the server's, so each location repeats it.
    set $csp "connect-src 'self' blob: data: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://firebase.googleapis.com https://firebaseinstallations.googleapis.com; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    location = / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|share-target\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
    }

    location ~ ^/(fonts|pdfjs|tesseract|brand|promo)/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Security-Policy $csp always;
    }

    # Spec 040: timestamp requests (only a hash of a signature) go on to the
    # timestamp authority, which browsers cannot reach directly (no CORS).
    location = /tsa {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        # Resolved per request, so the server starts even without DNS. The
        # resolvers come from the container (NGINX_ENTRYPOINT_LOCAL_RESOLVERS).
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s;
        set $tsa "http://timestamp.digicert.com/";
        proxy_pass $tsa;
        proxy_set_header Host timestamp.digicert.com;
        proxy_set_header Content-Type application/timestamp-query;
            add_header Cache-Control "no-store";
        add_header Content-Security-Policy $csp always;
    }

    # PDFs shared from other apps are taken by the service worker; if it is
    # not running yet, open the app instead of answering 405.
    location = /app/share-target {
        return 303 /app/;
    }

    location /app/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        try_files $uri /app/index.html;
    }
}
